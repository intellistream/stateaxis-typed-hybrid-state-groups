[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-typed-hybrid-state-groups"
version = "0.2.0"
description = "ECPA-bound StateAxis typed recurrent and full-KV state groups"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext>=0.3,<0.4"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-typed-hybrid-state-groups" = "stateaxis_typed_hybrid_state_groups"

[project.entry-points."stateaxis.mod_handlers"]
typed_hybrid_state_groups = "stateaxis_typed_hybrid_state_groups:typed_hybrid_state_groups"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_typed_hybrid_state_groups"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
